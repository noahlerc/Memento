<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Memento">
<title>Memento – Das Leben in Momenten</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#252923;background:#f7f6f2}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}main{max-width:640px;margin:auto;padding:55px 24px 125px}header{margin-bottom:64px}h1{font-size:55px;letter-spacing:-3px;margin:0;font-weight:800}header p,.muted{color:#898f86}header p{font-size:17px;margin:8px 0}.eyebrow{font-size:12px;letter-spacing:3px;color:#38594b;font-weight:750}h2{font-size:35px;letter-spacing:-1.5px;margin:20px 0 12px}.date{color:#898f86;font-size:18px;margin-bottom:30px}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:30px;display:block}.picker{width:100%;aspect-ratio:1/1;border:0;border-radius:30px;background:white;color:#252923;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px}.plus{width:76px;height:76px;border-radius:50%;background:#e9eee9;display:grid;place-items:center;color:#38594b;font-size:46px;font-weight:200}.picker strong{font-size:21px}.picker small{color:#898f86;font-size:16px}.field{width:100%;border:0;border-radius:17px;padding:16px 18px;background:white;margin-top:14px;outline-color:#38594b}textarea.field{min-height:96px;resize:vertical}.primary{background:#38594b;color:white;border:0;border-radius:17px;padding:16px 20px;font-weight:700;width:100%;margin-top:15px}.secondary{background:#e9eee9;color:#38594b;border:0;border-radius:14px;padding:12px 16px;font-weight:650}.entry{background:white;border-radius:22px;overflow:hidden;margin:16px 0}.entry img{width:100%;max-height:360px;object-fit:cover;display:block}.entry-content{padding:19px}.entry h3{margin:6px 0;font-size:21px}.entry p{white-space:pre-wrap;line-height:1.5}.entry-actions{display:flex;gap:10px;margin-top:15px}.entry-actions button{border:0;background:#f0f2ee;border-radius:10px;padding:9px 13px;color:#38594b}.empty{color:#898f86;line-height:1.6;margin-top:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:0;background:white;border-radius:18px;overflow:hidden;text-align:left;padding:0}.tile img{width:100%;aspect-ratio:1/1;object-fit:cover}.tile div{padding:12px}.tile small{color:#898f86}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid #e5e7e2;display:flex;justify-content:space-around;padding:11px 6px calc(12px + env(safe-area-inset-bottom))}.tabs button{border:0;background:none;color:#90978d;min-width:92px;display:grid;gap:5px;justify-items:center;font-size:12px;font-weight:700}.tabs button.active{color:#38594b}.tabs span{font-size:25px}.hidden{display:none!important}.hint{font-size:12px;color:#898f86;line-height:1.5;margin-top:12px}.topactions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 0}.topactions button{border:0;border-radius:12px;background:#e9eee9;color:#38594b;padding:10px;font-size:13px}input[type=file]{display:none}
</style>
</head>
<body>
<main>
<header><h1>memento.</h1><p>Das Leben in Momenten.</p></header>
<section id="today"><div class="eyebrow">DEIN HEUTE</div><h2>Ein Moment bleibt.</h2><div class="date" id="todayDate"></div><button class="picker" id="pick" type="button"><span class="plus">+</span><strong>Foto hinzufügen</strong><small>Wähle deinen Moment.</small></button><img class="photo hidden" id="preview" alt="Ausgewählter Moment"><button id="change" class="secondary hidden" style="margin-top:12px" type="button">Anderes Foto wählen</button><input id="file" type="file" accept="image/*"><input id="title" class="field" maxlength="100" placeholder="Ein paar Worte dazu …" aria-label="Titel"><textarea id="note" class="field" placeholder="Was möchtest du festhalten? (optional)" aria-label="Notiz"></textarea><button class="primary" id="save" type="button">Erinnerung speichern</button><p class="hint">Deine Erinnerungen bleiben auf diesem Gerät. Sichere sie regelmäßig über „Backup exportieren“ im Tagebuch.</p></section>
<section id="diary" class="hidden"><div class="eyebrow">DEINE GESCHICHTE</div><h2>Tagebuch.</h2><div class="topactions"><button id="export" type="button">Backup exportieren</button><button id="importBtn" type="button">Backup importieren</button><input type="file" id="importFile" accept="application/json,.json"></div><div id="entries"></div></section>
<section id="memories" class="hidden"><div class="eyebrow">WAS BLEIBT</div><h2>Rückblicke.</h2><p class="muted">Deine Momente auf einen Blick.</p><div class="grid" id="gallery"></div></section>
</main>
<nav class="tabs" aria-label="Navigation"><button class="active" data-tab="today" type="button"><span>▣</span>Heute</button><button data-tab="diary" type="button"><span>▤</span>Tagebuch</button><button data-tab="memories" type="button"><span>▢</span>Rückblicke</button></nav>
<script>
'use strict';
const KEY='memento_web_entries_v1';
const $=id=>document.getElementById(id);
let entries=[];let photo='';let editId=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))entries=saved;}catch(e){alert('Gespeicherte Daten konnten nicht gelesen werden.');}
const pretty=d=>new Date(d).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
$('todayDate').textContent=pretty(Date.now());
function tab(name){['today','diary','memories'].forEach(x=>$(x).classList.toggle('hidden',x!==name));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));render();window.scrollTo(0,0);}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
$('pick').onclick=$('change').onclick=()=>$('file').click();
$('file').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{photo=await compress(file);showPhoto();}catch(err){alert('Das Foto konnte nicht geladen werden.');}e.target.value='';};
function compress(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const max=1100;const scale=Math.min(1,max/Math.max(image.width,image.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(image.width*scale));c.height=Math.max(1,Math.round(image.height*scale));c.getContext('2d').drawImage(image,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.68));};image.src=reader.result;};reader.readAsDataURL(file);});}
function showPhoto(){$('preview').src=photo||'';$('preview').classList.toggle('hidden',!photo);$('change').classList.toggle('hidden',!photo);$('pick').classList.toggle('hidden',!!photo);}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));entries=next;return true;}catch(e){alert('Der Speicher ist voll. Bitte exportiere ein Backup und verwende kleinere oder weniger Fotos.');return false;}}
$('save').onclick=()=>{if(!photo){alert('Bitte wähle zuerst ein Foto aus.');return;}const old=entries.find(x=>x.id===editId);const item={id:editId||String(Date.now())+'-'+Math.random().toString(36).slice(2),date:old?.date||new Date().toISOString(),title:$('title').value.trim()||'Mein Moment',note:$('note').value.trim(),photo};const next=editId?entries.map(x=>x.id===editId?item:x):[item,...entries];if(!persist(next))return;photo='';editId=null;$('title').value='';$('note').value='';$('save').textContent='Erinnerung speichern';showPhoto();tab('diary');};
function render(){const sorted=[...entries].sort((a,b)=>new Date(b.date)-new Date(a.date));$('entries').replaceChildren();$('gallery').replaceChildren();if(!sorted.length){const p=document.createElement('p');p.className='empty';p.textContent='Hier erscheinen deine Erinnerungen, sobald du deinen ersten Moment speicherst.';$('entries').append(p);const p2=p.cloneNode(true);$('gallery').append(p2);return;}sorted.forEach(item=>{const article=document.createElement('article');article.className='entry';const img=document.createElement('img');img.src=item.photo;img.alt=item.title||'Erinnerung';article.append(img);const content=document.createElement('div');content.className='entry-content';const date=document.createElement('small');date.className='muted';date.textContent=pretty(item.date);const h=document.createElement('h3');h.textContent=item.title||'Mein Moment';content.append(date,h);if(item.note){const p=document.createElement('p');p.textContent=item.note;content.append(p);}const actions=document.createElement('div');actions.className='entry-actions';const edit=document.createElement('button');edit.textContent='Bearbeiten';edit.onclick=()=>{editId=item.id;photo=item.photo;$('title').value=item.title||'';$('note').value=item.note||'';$('save').textContent='Änderungen speichern';showPhoto();tab('today');};const del=document.createElement('button');del.textContent='Löschen';del.onclick=()=>{if(confirm('Diese Erinnerung wirklich löschen?')){persist(entries.filter(x=>x.id!==item.id));render();}};actions.append(edit,del);content.append(actions);article.append(content);$('entries').append(article);const tile=document.createElement('button');tile.className='tile';const ti=document.createElement('img');ti.src=item.photo;ti.alt=item.title||'Moment';const label=document.createElement('div');const strong=document.createElement('strong');strong.textContent=item.title||'Mein Moment';const small=document.createElement('small');small.textContent=pretty(item.date);label.append(strong,document.createElement('br'),small);tile.append(ti,label);tile.onclick=()=>tab('diary');$('gallery').append(tile);});}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Memento',version:1,entries},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='memento-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='Memento'||!Array.isArray(data.entries)||!data.entries.every(x=>typeof x.id==='string'&&typeof x.photo==='string'&&typeof x.date==='string'))throw Error('Ungültiges Backup');if(!confirm('Backup importieren? Vorhandene Erinnerungen bleiben erhalten.'))return;const ids=new Set(entries.map(x=>x.id));const combined=[...entries,...data.entries.filter(x=>!ids.has(x.id))];if(persist(combined)){render();alert('Backup importiert.');}}catch(err){alert('Die Datei ist kein gültiges Memento-Backup.');}finally{e.target.value='';}};
render();
</script>
</body>
</html>
